<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackBox - Tienda</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #111111;
            border: 2px solid #581c87;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(88, 28, 135, 0.4);
        }
        h2 {
            color: #d8b4fe;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #581c87;
            background: #050505;
            color: white;
            box-sizing: border-box;
        }
        button {
            background-color: #581c87;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #6b21a8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SnackBox 🛒</h2>
        <label for="nombreCliente">Tu Nombre:</label>
        <input type="text" id="nombreCliente" placeholder="Ej. Carlos Pérez">

        <label for="detallePedido">¿Qué vas a pedir?:</label>
        <input type="text" id="detallePedido" placeholder="Ej. 1 Sabritas y un Boing">

        <!-- Botón que manda a llamar la función de Firebase -->
        <button onclick="realizarPedido()">Hacer Pedido</button>
    </div>

    <!-- Script de Firebase y lógica del sistema -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCl3GsqhjPwXXzyoG_IboStDEJNzcM822A",
            authDomain: "snackbox-27b4f.firebaseapp.com",
            projectId: "snackbox-27b4f",
            storageBucket: "snackbox-27b4f.firebasestorage.app",
            messagingSenderId: "889060276210",
            appId: "1:889060276210:web:eabead411c5e463d651d6b",
            measurementId: "G-ZMTLFPJ8K6"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Función global para enviar el pedido desde los inputs de la página
        window.realizarPedido = async function() {
            const cliente = document.getElementById("nombreCliente").value.trim();
            const pedido = document.getElementById("detallePedido").value.trim();

            if (!cliente || !pedido) {
                alert("Por favor llena todos los campos, bro.");
                return;
            }

            try {
                await addDoc(collection(db, "pedidos_snackbox"), {
                    cliente: cliente,
                    pedido: pedido,
                    estado: "Pendiente",
                    timestamp: new Date()
                });
                alert("¡Pedido enviado con éxito a la nube!");
                document.getElementById("nombreCliente").value = "";
                document.getElementById("detallePedido").value = "";
            } catch (e) {
                console.error("Error al enviar el pedido: ", e);
                alert("Hubo un error al enviar el pedido.");
            }
        };
    </script>
</body>
</html>
