<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos - Snack Box</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0f0f11;
            --primary-wine: #581c87;
            --wine-hover: #7e22ce;
            --accent-color: #f59e0b;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1f1f23;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            background-color: #000000;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 22px; font-weight: 700; color: white; text-decoration: none; }
        .logo span { color: var(--accent-color); }
        .btn-regresar { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; }
        .btn-regresar:hover { color: white; }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .panel-header h1 { font-size: 24px; color: #ffffff; }
        
        .btn-borrar {
            background-color: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #991b1b;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-borrar:hover { background-color: #991b1b; color: white; }

        .pedidos-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pedido-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-wine);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.2s;
        }
        .pedido-card:hover { transform: translateX(3px); }

        .pedido-info h3 { font-size: 16px; color: #ffffff; margin-bottom: 4px; }
        .pedido-cliente { font-size: 15px; font-weight: 700; color: #c084fc; margin-bottom: 6px; }
        .pedido-nota { font-size: 13px; color: var(--text-muted); background: #09090b; padding: 6px 10px; border-radius: 4px; margin-top: 6px; border: 1px solid var(--border-color); }
        .pedido-meta { font-size: 12px; color: #71717a; margin-top: 8px; }

        .sin-pedidos {
            text-align: center;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Pantalla de bloqueo si no es el correo autorizado */
        #pantallaBloqueo {
            display: none;
            text-align: center;
            padding: 80px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-top: 40px;
        }
        #pantallaBloqueo h2 { color: #fca5a5; margin-bottom: 10px; }
        #pantallaBloqueo p { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Snack<span>Box</span></a>
        <a href="index.html" class="btn-regresar">← Ir al Catálogo</a>
    </header>

    <div class="container" id="contenidoPanel">
        <div class="panel-header">
            <h1>📦 Panel de Pedidos Entrantes</h1>
            <button class="btn-borrar" onclick="limpiarHistorial()">Borrar Historial</button>
        </div>

        <div class="pedidos-grid" id="contenedorPedidos"></div>
    </div>

    <!-- Bloqueo de seguridad -->
    <div class="container" id="pantallaBloqueo">
        <h2>🔒 Acceso Restringido</h2>
        <p>No tienes permisos de administrador para ver este panel. Operación bloqueada por seguridad escolar.</p>
        <br>
        <a href="index.html" class="btn-regresar" style="color: #c084fc;">Volver al inicio</a>
    </div>

    <script>
        function validarSeguridadPanel() {
            const correoAutorizado = "gabrieldejesussalcedoyanez@gmail.com";
            const correoRegistrado = localStorage.getItem('snackbox_user_email');

            if (correoRegistrado !== correoAutorizado) {
                // Ocultar panel y mostrar bloqueo
                document.getElementById('contenidoPanel').style.display = 'none';
                document.getElementById('pantallaBloqueo').style.display = 'block';
            } else {
                cargarPedidos();
            }
        }

        function cargarPedidos() {
            const contenedor = document.getElementById('contenedorPedidos');
            const pedidos = JSON.parse(localStorage.getItem('lista_pedidos_snackbox') || '[]');

            if (pedidos.length === 0) {
                contenedor.innerHTML = `<div class="sin-pedidos">Aún no hay ningún pedido registrado. Cuando tus compas pidan algo, aparecerá aquí al instante.</div>`;
                return;
            }

            let html = '';
            pedidos.forEach(p => {
                html += `
                    <div class="pedido-card">
                        <div class="pedido-info">
                            <div class="pedido-cliente">👤 Cliente: ${p.cliente}</div>
                            <h3>🍬 Producto: ${p.producto} (${p.precio})</h3>
                            <div class="pedido-nota">💬 Nota: ${p.nota}</div>
                            <div class="pedido-meta">🕒 Hora: ${p.fecha}</div>
                        </div>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        function limpiarHistorial() {
            if (confirm("¿Estás seguro de borrar todos los pedidos entregados?")) {
                localStorage.removeItem('lista_pedidos_snackbox');
                cargarPedidos();
            }
        }

        document.addEventListener('DOMContentLoaded', validarSeguridadPanel);
    </script>
</body>
</html>
