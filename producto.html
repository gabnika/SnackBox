<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer Pedido - Snack Box</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0f0f11;
            --primary-wine: #581c87;
            --wine-hover: #7e22ce;
            --accent-color: #f59e0b;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1f1f23;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background-color: #000000;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 22px; font-weight: 700; color: white; text-decoration: none; }
        .logo span { color: var(--accent-color); }
        .btn-regresar { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .btn-regresar:hover { color: white; }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            .product-detail-grid { grid-template-columns: 1fr; }
        }

        .detail-img-box {
            width: 100%;
            height: 350px;
            background-color: #09090b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .detail-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .placeholder-text { color: var(--text-muted); font-weight: 500; }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .detail-title { font-size: 24px; font-weight: 700; color: #ffffff; }
        .detail-price { font-size: 22px; font-weight: 700; color: var(--accent-color); }
        .detail-desc { font-size: 14px; color: var(--text-muted); }

        .form-pedido {
            margin-top: 10px;
            background: #09090b;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-pedido h3 { color: #ffffff; font-size: 15px; }
        .form-pedido label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .form-pedido input {
            width: 100%;
            padding: 11px;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-pedido input:focus {
            outline: none;
            border-color: var(--primary-wine);
        }
        
        .btn-enviar-pedido {
            background-color: var(--primary-wine);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .btn-enviar-pedido:hover { background-color: var(--wine-hover); }
        
        .mensaje-exito {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Snack<span>Box</span></a>
        <a href="index.html" class="btn-regresar">← Volver al catálogo</a>
    </header>

    <div class="container">
        <div class="product-detail-grid">
            <div class="detail-img-box" id="imagenContenedor">
                <span class="placeholder-text">Foto del Snack</span>
            </div>
            
            <div class="detail-info">
                <h1 class="detail-title" id="nombreProducto">Cargando...</h1>
                <div class="detail-price" id="precioProducto">$0</div>
                <p class="detail-desc" id="descProducto">Cargando detalles...</p>
                
                <div class="form-pedido">
                    <h3>📝 Hacer Pedido Directo</h3>
                    <div>
                        <label>Tu Nombre / Apodo:</label>
                        <input type="text" id="inputNombre" placeholder="Ej. Carlos del 3ro">
                    </div>
                    <div>
                        <label>Nota o cantidad (Opcional):</label>
                        <input type="text" id="inputNota" placeholder="Ej. Con extra chile, nos vemos en la entrada">
                    </div>
                    <button class="btn-enviar-pedido" onclick="realizarPedido()">¡Enviar Pedido! 🚀</button>
                    <div class="mensaje-exito" id="alertaExito">¡Pedido registrado con éxito! El sistema lo guardó en el panel.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const listaProductos = [
            { id: 1, nombre: "Vasito Loco con Gomitas y Chamoy", precio: "$25", desc: "Mezcla de gomitas surtidas bañadas en chamoy, miguelito y tarugo.", imagen: "" },
            { id: 2, nombre: "Bolsita de Skittles Aciditos", precio: "$20", desc: "La porción perfecta para el antojo con un toque extra de chile en polvo.", imagen: "" },
            { id: 3, nombre: "Skwinkles Relleno de Tamarindo", precio: "$18", desc: "Tira de caramelo suave con relleno ácido y tarugo incluido.", imagen: "" },
            { id: 4, nombre: "Takis Fuego con Limón Extra", precio: "$22", desc: "La clásica botana picosita en presentación individual.", imagen: "" },
            { id: 5, nombre: "Paleta Vero Tarugo con Miguelito", precio: "$12", desc: "Caramelo macizo de tamarindo cubierto de chilito en polvo.", imagen: "" },
            { id: 6, nombre: "Duvalín Bicolor (Fresa y Avellana)", precio: "$10", desc: "El dulce clásico para combinar o comer con cucharita.", imagen: "" },
            { id: 7, nombre: "Bubulubu Relleno de Malvavisco", precio: "$12", desc: "Barrita cubierta de chocolate con centro de jalea de fresa.", imagen: "" },
            { id: 8, nombre: "Pica Fresas (Bolsa con 10 pzas)", precio: "$15", desc: "Gomitas sabor fresa con capa crujiente y chilito picoso.", imagen: "" },
            { id: 9, nombre: "Lucas Muecas Sabor Sandía", precio: "$15", desc: "Paleta de caramelo con polvo acidito para untar.", imagen: "" },
            { id: 10, nombre: "Cacahuates Japoneses Nishikawa", precio: "$18", desc: "Cacahuates crujientes con capa dorada y salada.", imagen: "" },
            { id: 11, nombre: "Banderilla de Tamarindo con Chile", precio: "$15", desc: "Tamarindo natural picosito en palito con toque de sal y limón.", imagen: "" },
            { id: 12, nombre: "Chicles Clorets o Trident Menta", precio: "$14", desc: "Gomas de mascar para después del recreo.", imagen: "" },
            { id: 13, nombre: "Gomitas Panditas Ricolino", precio: "$18", desc: "Bolsita clásica de ositos de gomita de diferentes sabores.", imagen: "" },
            { id: 14, nombre: "Boing de Mango o Guayaba 500ml", precio: "$15", desc: "Bebida fría para acompañar tus snacks favoritos.", imagen: "" },
            { id: 15, nombre: "Paleta Kranky con Chocolate", precio: "$14", desc: "Paleta de caramelo crujiente cubierta de chocolate con cereal.", imagen: "" },
            { id: 16, nombre: "Mazapán de la Rosa Gigante", precio: "$12", desc: "Dulce tradicional de cacahuate que se deshace delicioso en la boca.", imagen: "" },
            { id: 17, nombre: "Pelón Pelo Rico Clásico", precio: "$16", desc: "Dulce de tamarindo líquido para exprimir y disfrutar.", imagen: "" },
            { id: 18, nombre: "Papas Ruffles Queso Individual", precio: "$20", desc: "Papas crujientes con sabor intenso a queso.", imagen: "" },
            { id: 19, nombre: "Bolsa Sorpresa 'Snack Box' Mixta", precio: "$45", desc: "Caja especial con 5 dulces sorpresa diferentes y chamoy.", imagen: "" },
            { id: 20, nombre: "Mega Tarugo Relleno", precio: "$15", desc: "Barra grande de tamarindo con centro acidito.", imagen: "" }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productoId = parseInt(urlParams.get('id')) || 1;
        const productoActual = listaProductos.find(p => p.id === productoId) || listaProductos[0];

        document.getElementById('nombreProducto').innerText = productoActual.nombre;
        document.getElementById('precioProducto').innerText = productoActual.precio;
        document.getElementById('descProducto').innerText = productoActual.desc;

        if (productoActual.imagen) {
            document.getElementById('imagenContenedor').innerHTML = `<img src="${productoActual.imagen}" alt="${productoActual.nombre}">`;
        }

        function realizarPedido() {
            const nombre = document.getElementById('inputNombre').value.trim();
            const nota = document.getElementById('inputNota').value.trim();

            if (!nombre) {
                alert("Por favor escribe tu nombre para saber a quién entregarle.");
                return;
            }

            const nuevoPedido = {
                id: Date.now(),
                cliente: nombre,
                producto: productoActual.nombre,
                precio: productoActual.precio,
                nota: nota || "Sin notas adicionales",
                fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let pedidos = JSON.parse(localStorage.getItem('lista_pedidos_snackbox') || '[]');
            pedidos.unshift(nuevoPedido);
            localStorage.setItem('lista_pedidos_snackbox', JSON.stringify(pedidos));

            document.getElementById('alertaExito').style.display = 'block';
            document.getElementById('inputNombre').value = '';
            document.getElementById('inputNota').value = '';

            setTimeout(() => {
                document.getElementById('alertaExito').style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
